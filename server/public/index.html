<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CarTalk Display</title>
    <link rel="stylesheet" href="display.css" />
  </head>
  <body>
    <!-- The message stage. `data-animation` drives the CSS animation. -->
    <main id="stage" class="stage blank" data-animation="none">
      <div id="content" class="content">
        <span id="emoji" class="emoji"></span>
        <span id="text" class="text"></span>
      </div>
    </main>

    <!-- Animated CSS "living face". `data-expression` selects the emotion;
         the eyes blink on their own for a lively look. -->
    <div id="face" class="face" data-expression="happy" hidden>
      <span class="brow left"></span>
      <span class="brow right"></span>
      <span class="shades"></span>
      <span class="eye left"></span>
      <span class="eye right"></span>
      <span class="mouth"></span>
    </div>

    <!-- Idle screen shown when nothing is displayed. -->
    <div id="idle" class="idle">
      <div class="idle-logo">🚗💬</div>
      <div class="idle-title">CarTalk</div>
      <div id="status" class="idle-status">Connecting…</div>
      <button id="micBtn" class="mic-btn" hidden>🎤 Tap to speak</button>
      <div id="hint" class="idle-hint"></div>
    </div>

    <script src="display.js"></script>
  </body>
</html>
